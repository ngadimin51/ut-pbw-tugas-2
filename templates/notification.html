<!-- OVERLAY BACKGROUND (Langsung muncul karena 'invisible' & 'opacity-0' dihapus) -->
<div id="modal-overlay" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity duration-300">
    
    <!-- STRUKTUR DIV (Langsung muncul karena 'opacity-0' dan 'scale-95' diubah ke wajar) -->
    <div id="modal-box" class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 transform scale-100 opacity-100 transition-all duration-300 overflow-hidden">
      
      <!-- HEADER -->
      <div id="modal-header" class="px-6 py-4 border-b border-gray-100 text-lg font-bold text-gray-900 flex items-center justify-between">
        <h1>{{title}}</h1>
        <button class="cursor-pointer text-gray-400 hover:text-gray-600 transition" @click="closeNotification()">✕</button>
      </div>
      
      <!-- BODY -->
      <div id="modal-body" class="px-6 py-6 text-gray-600 text-sm leading-relaxed flex items-start gap-4">
        
        <!-- BAGIAN IKON BERDASARKAN TIPE -->
        <div class="flex-shrink-0">
          <!-- Tipe: Warning -->
          <div v-if="type === 'warning'" class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-amber-100 text-amber-600 shadow-sm">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
          </div>

          <!-- Tipe: Danger -->
          <div v-else-if="type === 'danger'" class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-red-100 text-red-600 shadow-sm">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
            </svg>
          </div>

          <!-- Tipe: Default / Success / Info -->
          <div v-else class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-blue-100 text-blue-600 shadow-sm">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 111.086.796L10.5 17.25h1.625a.75.75 0 010 1.5H9.75a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h.441l1.066-2.53zm1-3.136a1.125 1.125 0 11-2.25 0 1.125 1.125 0 012.25 0z" />
            </svg>
          </div>
        </div>

        <!-- BAGIAN KONTEN TEKS -->
        <div class="flex-1 pt-1">
          <p v-html="message"></p>
        </div>

      </div>
      
      <!-- FOOTER -->
      <div id="modal-footer" class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-end gap-2">
        <div v-html="footer"></div>
      </div>
      
    </div>

</div>
